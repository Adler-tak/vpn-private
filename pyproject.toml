[project]
name = "vpn-private"
version = "1.0.0"
description = "Enterprise Multi-Agent Telegram VPN Sales and Management Platform"
authors = [{ name = "VPN Private Engineering Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15.0",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.1",
    "celery>=5.4.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.1",
    "cryptography>=44.0.0",
    "qrcode[pil]>=8.0",
    "pillow>=11.0.0",
    "python-multipart>=0.0.20",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]

